name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json

      - run: npm ci
      # eslint covers the demo too, and its type-checked rules need the demo's
      # own dependencies resolvable.
      - run: npm ci --prefix demo

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  package:
    name: Package validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # publint checks the published shape (exports, files, formats);
      # attw checks that the types resolve under every moduleResolution.
      - name: Validate the package that would be published
        run: npm run check:exports

      - name: Show what npm would publish
        run: npm pack --dry-run

  matrix:
    name: Node ${{ matrix.node }} / React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The active LTS lines. Node 20 went end-of-life in April 2026 and the
        # test toolchain (jsdom 30) no longer runs on it; the published package
        # itself is browser code and carries no such requirement.
        node: [22, 24]
        react: [18, 19]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The peer range claims React 18 and 19; install the one under test and
      # make sure the build and the tests still hold against it.
      - name: Install React ${{ matrix.react }}
        if: matrix.react != 18
        run: |
          npm install --no-save \
            react@^${{ matrix.react }} \
            react-dom@^${{ matrix.react }} \
            @types/react@^${{ matrix.react }} \
            @types/react-dom@^${{ matrix.react }}

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  demo:
    name: Demo build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json

      # The demo imports the library from `src/`, so those files resolve React
      # and the ACS types from the root install, not from `demo/`.
      - run: npm ci
      - run: npm ci --prefix demo

      - name: Typecheck the demo
        run: npm run typecheck --prefix demo

      - name: Build the demo
        run: npm run build --prefix demo
